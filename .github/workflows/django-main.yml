name: Django main

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — advisory early warning for the next Django. See ADR-0024.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  test-django-main:
    name: Test against Django git main (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run the Django main tox env
        run: >
          uvx --with tox-uv tox run
          -e py$(echo ${{ matrix.python-version }} | tr -d .)-djangomain-mcp-release

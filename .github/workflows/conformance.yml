name: Conformance

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Bump deliberately, reconciling expected-failures*.yml in the same change. See ADR-0008.
  CONFORMANCE_PKG: "@modelcontextprotocol/conformance@0.2.0-alpha.10"

jobs:
  server-conformance:
    name: Server conformance (2026-07-28)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run server conformance
        run: >-
          ./scripts/run_conformance.sh
          --suite all
          --spec-version 2026-07-28
          --expected-failures .github/conformance/expected-failures.2026-07-28.yml

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-stateless-mcp"
version = "0.1.9"
description = "Stateless Model Context Protocol (MCP) server for Django, built on the 2026-07-28 spec."
readme = "README.md"
license = { text = "MIT" }
maintainers = [ { name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk" } ]
authors = [ { name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "django>=5.2",
  "mcp>=2,<3",
]
optional-dependencies.structlog = [
  "structlog",
]
urls.bugs = "https://github.com/Streamlined-Analytics/django-stateless-mcp/issues"
urls.changelog = "https://github.com/Streamlined-Analytics/django-stateless-mcp/releases"
urls.documentation = "https://django-stateless-mcp.readthedocs.io/"
urls.homepage = "https://github.com/Streamlined-Analytics/django-stateless-mcp"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typecheck" },
]
test = [
  "coverage",
  # Runtime shim letting the example's admin classes carry django-stubs generics.
  "django-stubs-ext",
  # gunicorn + uvicorn boot the real multi-worker fleets in test_multiworker.
  "gunicorn",
  "pytest",
  "pytest-django",
  "structlog",
  "uvicorn",
]
docs = [
  # MkDocs 2.0 breaks all plugins and themes, no migration path. See ADR-0002.
  "mkdocs<2",
  "mkdocs-material",
  "mkdocstrings-python",
]
lint = [
  "pre-commit",
  "ruff",
]
typecheck = [
  "django-stubs",
  "mypy",
]

[tool.uv]
# uv 0.9.17 is the first that parses a relative exclude-newer duration.
required-version = ">=0.9.17"
default-groups = [ "dev" ]
exclude-newer = "1 week"
package = true

[tool.ruff]
line-length = 120
lint.select = [
  "B",  # flake8-bugbear
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
python_version = "3.10"
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
plugins = [ "mypy_django_plugin.main" ]
overrides = [
  # Annotating every test adds noise without adding safety.
  { module = "tests.*", allow_untyped_defs = true },
]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest]
django_find_project = false
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [ "." ]
testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
# Pure launch entrypoints; only a booted server executes them.
run.omit = [ "example/asgi.py", "example/wsgi.py" ]
run.parallel = true
run.source = [ "example/", "src/", "tests/" ]
report.exclude_also = [
  "@(abc\\.)?abstractmethod",
  "@overload",
  "@typing.overload",
  "\\.\\.\\.",
  "class .*\\bProtocol\\):",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.fail_under = 50
report.show_missing = true
report.skip_covered = true

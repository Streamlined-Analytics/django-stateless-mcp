ci:
  autoupdate_schedule: monthly
  # The local mypy hook needs the uv project env, which pre-commit.ci lacks.
  skip: [mypy]

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: dd369349b73c245acd4dd4154a4bdf771d052150  # frozen: typos-dict-v0.14.2
    hooks:
      - id: typos

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: a72ae8edd6eeddb9d942168912362945651212f8  # frozen: v2.30.1
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies:
          - black==25.1.0

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 5a815b88d9286ba45b8c1a4b56e695ff5645c65e  # frozen: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.2"]

  - repo: local
    hooks:
      # Runs in the project env so django/mcp resolve. See ADR-0004.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src/, tests/]

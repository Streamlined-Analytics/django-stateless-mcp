[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-stateless-mcp"
version = "0.1.0"
description = "Stateless Model Context Protocol (MCP) server for Django, built on the 2026-07-28 spec."
readme = "README.md"
authors = [
  {name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk"}
]
maintainers = [
  {name = "Ben Atkinson", email = "ben@streamlinedanalytics.co.uk"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "mypy",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/Streamlined-Analytics/django-stateless-mcp/issues"
changelog = "https://github.com/Streamlined-Analytics/django-stateless-mcp/releases"
documentation = "https://Streamlined-Analytics.github.io/django-stateless-mcp/"
homepage = "https://github.com/Streamlined-Analytics/django-stateless-mcp"

[project.scripts]
django_stateless_mcp = "django_stateless_mcp.cli:app"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

# Tests exercise the public API the way a consumer would; annotating every test
# adds noise without adding safety.
[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev"]
# Relative exclude-newer durations ("1 week") were added in uv 0.9.17; an
# older uv cannot parse the value below and would fail confusingly.
required-version = ">=0.9.17"
exclude-newer = "1 week"

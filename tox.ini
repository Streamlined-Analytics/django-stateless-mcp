[tox]
requires =
    tox>=4.2
env_list =
    py{312,313,314}-django{52,60}-mcp{-release,-latest}

[testenv]
package = wheel
wheel_build_env = .pkg
dependency_groups = test
deps =
    django52: django>=5.2,<6
    django60: django>=6,<6.1
    ; Weekly advisory envs (django-main.yml), deliberately not in env_list. See ADR-0024.
    djangomain: django @ git+https://github.com/django/django@main
    mcp-release: mcp>=2,<3
    ; Advisory; pulls mcp-types itself. Do not add it here. See ADR-0006.
    mcp-latest: mcp @ git+https://github.com/modelcontextprotocol/python-sdk@main
set_env =
    PYTHONDEVMODE = 1
commands =
    python \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m coverage run \
      -m pytest {posargs:tests}
